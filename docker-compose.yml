
services:
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-mvp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: ecommerce_mvp
    ports:
      - "5433:5432"
    volumes:
      - ecommerce_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce_mvp"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: ecommerce-mvp-api
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: "postgresql://postgres:postgres123@postgres:5432/ecommerce_mvp?schema=public"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required}"
      JWT_EXPIRES_IN: "${JWT_EXPIRES_IN:-1d}"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  ecommerce_pgdata:
